name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # for OIDC login to Azure
  contents: read

concurrency: deploy-azure-functions

env:
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Idempotent: brings the resource group in line with the template on every run.
      - name: Provision Function App
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters appName="$AZURE_FUNCTIONAPP_NAME" \
                         spotifyClientId="$SPOTIFY_CLIENT_ID" \
                         spotifyClientSecret="$SPOTIFY_CLIENT_SECRET" \
            --query properties.outputs

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: .
          sku: flex
          remote-build: true # installs requirements.txt on Azure
          respect-funcignore: true
